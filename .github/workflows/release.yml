name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify typecheck, tests, and build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Package release archives
        run: |
          mkdir -p release-stage/antigravity-swarm-plaza
          cp -r dist src package.json package-lock.json tsconfig.json vite.config.ts README.md release-stage/antigravity-swarm-plaza/
          cd release-stage
          tar -czf antigravity-swarm-plaza-${{ github.ref_name }}.tar.gz antigravity-swarm-plaza
          zip -rq antigravity-swarm-plaza-${{ github.ref_name }}.zip antigravity-swarm-plaza

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-stage/antigravity-swarm-plaza-*.tar.gz
            release-stage/antigravity-swarm-plaza-*.zip
