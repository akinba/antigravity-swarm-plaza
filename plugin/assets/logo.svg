<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#131622" />
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#181d30" stroke="#3cd8ff" stroke-width="2" />

  <!-- Stars -->
  <rect x="10" y="10" width="2" height="2" fill="#ffd147" />
  <rect x="50" y="12" width="2" height="2" fill="#9aa7c7" />
  <rect x="14" y="22" width="2" height="2" fill="#9aa7c7" />
  <rect x="52" y="26" width="2" height="2" fill="#3cd8ff" />

  <!-- Antenna & Beacon -->
  <rect x="31" y="6" width="2" height="8" fill="#9aa7c7" />
  <rect x="30" y="4" width="4" height="4" fill="#ff5666" />

  <!-- Penthouse Crown -->
  <rect x="22" y="14" width="20" height="6" fill="#2c3554" stroke="#0a0c14" stroke-width="2" />
  <rect x="26" y="16" width="12" height="2" fill="#ffd147" />

  <!-- Main Skyscraper Tower -->
  <rect x="18" y="20" width="28" height="36" fill="#242c47" stroke="#0a0c14" stroke-width="2" />
  <!-- Left bevel highlight -->
  <rect x="20" y="22" width="2" height="32" fill="#3b4770" />
  <!-- Right shadow -->
  <rect x="42" y="22" width="2" height="32" fill="#151a2b" />

  <!-- Floor 3 Windows -->
  <rect x="23" y="24" width="5" height="4" fill="#3cd8ff" />
  <rect x="30" y="24" width="5" height="4" fill="#ffd147" />
  <rect x="37" y="24" width="4" height="4" fill="#3be87a" />

  <!-- Floor 2 Windows -->
  <rect x="23" y="32" width="5" height="4" fill="#b07cff" />
  <rect x="30" y="32" width="5" height="4" fill="#3cd8ff" />
  <rect x="37" y="32" width="4" height="4" fill="#3cd8ff" />

  <!-- Floor 1 Windows -->
  <rect x="23" y="40" width="5" height="4" fill="#3be87a" />
  <rect x="30" y="40" width="5" height="4" fill="#ffd147" />
  <rect x="37" y="40" width="4" height="4" fill="#b07cff" />

  <!-- Lobby Entrance -->
  <rect x="27" y="48" width="10" height="8" fill="#10131e" />
  <rect x="29" y="50" width="6" height="6" fill="#3cd8ff" />

  <!-- Ground Base -->
  <rect x="10" y="56" width="44" height="4" fill="#0a0c14" />
  <rect x="12" y="56" width="40" height="2" fill="#5a6994" />
</svg>
